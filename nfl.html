<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BetHouse — NFL</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="board.css">
</head>
<body>
<div class="wrap">
<header>
  <div class="brand">
    <h1 class="logo">BETHOUSE</h1>
    <div class="tagline" id="tagline">NFL</div>
  <nav class="boards" aria-label="Other boards">
  <a class="navlink" href="index.html">Home →</a>
  <a class="navlink" href="bets.html">Bets →</a>
  <a class="navlink" href="cfb.html">CFB →</a>
  <a class="navlink" href="baseball.html">Baseball →</a>
  <a class="navlink" href="golf.html">PGA →</a>
  <a class="navlink" href="live.html">Live →</a>
  <a class="navlink" href="record.html">Record →</a>
  <a class="navlink" href="teams.html">Teams →</a>
  </nav>
  </div>
  <div class="tile" id="tile"></div>
  <div class="ctl">
    <label id="lab-view">Bet type</label>
    <div class="seg" id="view" role="group" aria-labelledby="lab-view"></div>
  </div>
  <div class="ctl" id="find">
    <label id="lab-q" for="q">Find</label>
    <input class="search" id="q" type="search" placeholder="Player or team" autocomplete="off" spellcheck="false">
  </div>
</header>

<div class="note" id="note"></div>
<div class="controls" id="controls" hidden>
  <div class="ctl" id="linewrap">
    <label id="lab-line">Line</label>
    <div class="seg" id="lineseg" role="group" aria-labelledby="lab-line"></div>
  </div>
  <div class="ctl" id="sortwrap">
    <label id="lab-sort">Sort</label>
    <div class="seg" id="sortseg" role="group" aria-labelledby="lab-sort"></div>
  </div>
  <div class="ctl" id="teamwrap">
    <label id="lab-team" for="teamsel">Team</label>
    <select id="teamsel" class="search"></select>
  </div>
  <div class="ctl" id="poswrap" hidden>
    <label id="lab-pos">Position</label>
    <div class="seg" id="posseg" role="group" aria-labelledby="lab-pos"></div>
  </div>
  <div class="ctl" id="starwrap" hidden>
    <label id="lab-star">Watchlist</label>
    <div class="seg" id="starseg" role="group" aria-labelledby="lab-star"></div>
  </div>
  <div class="ctl" id="parlaywrap" hidden>
    <label id="lab-parlay">Parlay</label>
    <div class="seg" id="parlayseg" role="group" aria-labelledby="lab-parlay"></div>
  </div>
</div>
<div class="controls" id="parlayctl" hidden>
  <div class="ctl">
    <label id="lab-plegs">Legs</label>
    <div class="seg" id="plegs" role="group" aria-labelledby="lab-plegs"></div>
  </div>
  <div class="ctl">
    <label id="lab-pscope">From</label>
    <div class="seg" id="pscope" role="group" aria-labelledby="lab-pscope"></div>
  </div>
  <div class="ctl">
    <label id="lab-pkinds">Kinds</label>
    <div class="seg" id="pkinds" role="group" aria-labelledby="lab-pkinds"></div>
  </div>
  <div class="ctl" id="pgamewrap" hidden>
    <label id="lab-pgame" for="pgame">Game</label>
    <select id="pgame" class="search"></select>
  </div>
</div>
<div id="app"><div class="empty"><div class="big">Loading…</div>
  <div>If this does not clear, run <code>node fetch-nfl.mjs</code>.</div></div></div>
<div class="scrim" id="scrim" hidden></div>
<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dtitle" hidden>
  <div class="dbar" id="dbar"><button type="button" class="dcompare" id="dcompare" hidden>Compare</button><button type="button" class="dclose" id="dclose" aria-label="Close">×</button></div>
  <div class="dhead" id="dhead"><div class="dwho"><div class="dkick" id="dkick"></div><h2 id="dtitle"></h2><div class="dsub" id="dsub"></div></div><div class="dface" id="dface"></div></div>
  <div class="dbands" id="dbands"></div>
  <div class="seg dtabs" id="dtabs" role="group" aria-label="Sections"></div>
  <div class="why dbody" id="dbody"></div>
</div>
<div class="tray" id="tray" hidden><div class="tcards" id="tcards"></div><button type="button" class="tclear" id="tclear">Clear compare</button></div>
<footer id="foot"></footer>
</div>

<script src="edge.js"></script>
<script src="faces.js"></script>
<!-- Written by fetch-teams.mjs: each team's colours, for the hero's tint and the tray's edge. -->
<script src="teams-data.js"></script>
<script src="teams.js"></script>
<script src="nfl.js"></script>
<script src="nfl-data.js"></script>
<!-- Written by tendencies.mjs from nflverse play-by-play. The matchup
     panel on the game view reads it; the board works without it, and
     college has no play-by-play, so cfb.html loads no such file. -->
<script src="tendencies-data.js"></script>
<script src="tendencies-core.js"></script>
<!-- Written by track-nfl.mjs. Empty until a week has been graded. -->
<script src="nfl-record.js"></script>
<script src="parlay.js"></script>
<script src="watchlist.js"></script>
<script src="chips.js"></script>
<script src="football-board.js"></script>
<script>
/* The page is football-board.js, shared with cfb.html. What is the NFL's
   own is the model, the data, the record, and the numbers it quotes --
   every one of them from `node backtest-nfl.mjs` on 2026-09-05 (touchdowns, receiving yards, game lines) and 2026-09-08 (the other counting props). */
BetHouseFootballBoard.mount({
  model: window.BetHouseNFL,
  data: window.BetHouseNFLData,
  record: window.BETHOUSE_NFL_RECORD,
  league: 'NFL',
  fetcher: 'fetch-nfl.mjs',
  copy: {
    /* Each note leads with the inputs the number is made of, then the
       check it passed; every figure is from the README's tables (B6). */
    noteTD: 'Chance of <b>scoring a touchdown</b>, from his carries and targets a game (recent games weighted up, 3% a game of age; '+
      'a teammate ruled out leaves three quarters of his share to those still in), '+
      'his own scoring rate pulled toward what that workload usually scores, his offence against the league and the opponent\'s defence, '+
      'the whole pulled 25% toward the league average. Checked against <b>8,470</b> unseen player-games: '+
      'bias 0.8 points; the README has the bands for each term since. Tap a player for the work.',
    noteStat: {
      recyds: 'Chance of going <b>over</b> a receiving yards line, from his yards a game (recent games weighted up, 12% a game of age), pulled part of the way '+
        'toward an ordinary receiver, scaled up by half the targets a teammate ruled out leaves behind, with the over read off real receiver games near his own level rather than a bell curve. '+
        'The opponent is shown but not applied: on the replay it moved nothing. '+
        'Checked against <b>23,805</b> unseen player-games: bias 1.7 points, hot, the seasons 0 and 3, measured 2026-09-21 before the recent-form weight, '+
        'which read better on a window it was not fitted on (2026-10-01, the README has the table).',
      rushyds: 'Chance of going <b>over</b> a rushing yards line, from his yards a game (recent games weighted up, 3% a game of age), pulled toward an ordinary back, '+
        'the opponent\'s run defence applied at half strength, and the over read off real games by backs the board would price (a teammate ruled out is not applied: on the replay it read worse). '+
        'Checked against <b>11,150</b> unseen player-games: bias 0.9 points, hot, the seasons within a point (measured 2026-09-21, before the recent-form weight); '+
        'a pool that let quarterbacks\' scrambles in ran 7 points cold.',
      passyds: 'Chance of going <b>over</b> a passing yards line, from his yards a game, pulled toward an ordinary starter, the opponent\'s pass defence applied at half strength, '+
        'and the over read off real quarterback games. Checked against <b>4,560</b> unseen player-games: bias 1.1 points, hot, but the two seasons disagree by 4 points and '+
        'the bands say the number is too timid at both ends. Read it as approximate.',
      recs: 'Chance of going <b>over</b> a receptions line, from his catches a game, pulled toward an ordinary receiver, scaled up by half the targets a teammate ruled out leaves behind, with the over read off real receiver games. '+
        'The opponent is shown but not applied: on the replay it moved nothing. Checked against <b>24,015</b> unseen player-games: bias 0.1 points, though the two seasons disagree by 6.',
      rushrec: 'Chance of going <b>over</b> a <b>rushing plus receiving</b> yards line: the back who catches and the receiver who runs, his two yardages added and priced as one number, '+
        'from his rushing and receiving yards a game (recent games weighted up, 10% a game of age), pulled toward an ordinary player, scaled up by three quarters of the work a teammate ruled out leaves behind, off real games by backs and receivers. The opponent is not applied: on the replay it read worse. '+
        'Replayed over 30,245 player-games: bias 0.8 points, the seasons within two (measured 2026-09-21, before the recent-form weight). Tap a player for every alternate line with its fair price.'
    },
    noteGames: 'The side the model likes on each game, against a real line, with its expected value at the price. '+
      '<b>This model did not beat the closing line over two seasons</b> — read the note below before betting one.',
    gameBanner: '<p>These projections were measured against <b>480 real closing lines</b> and did not beat them. '+
      'The spread model won <b>48.1%</b> of the time and the total model <b>52.5%</b>, against the '+
      '<b>52.4%</b> you need at -110 — and both confidence intervals straddle a coin flip. '+
      'Separating a break-even model from noise would take about <b>1,700</b> games; two seasons is 480.</p>'+
      '<p>The picks are shown because you asked which side, not because there is proven edge in them. Every one '+
      'is recorded before kickoff and settled like a book would, and the live record at the bottom will say whether '+
      'they win and whether the closing line moves toward them.</p>',
    mlVerdict: '<b>Do not bet the moneyline off this.</b> In the replay the market\'s win probabilities beat the model\'s (Brier 0.1999 against 0.2220), and betting the side the model liked more than the market lost <b>11.9%</b> of stake over 468 games.',
    gameHonestly: 'this did not beat the closing line over two seasons'
  }
});
</script>
</body>
</html>

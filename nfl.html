<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BetHouse — NFL</title>
<link rel="stylesheet" href="fonts/space-grotesk.css">
<link rel="stylesheet" href="board.css">
<style>
/* nfl.html / cfb.html: the football boards' own rules. Everything else is board.css. */
@media (max-width:760px){
  /* Bet types scroll sideways rather than stacking into three rows. */
  .ctl .seg{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;margin-right:-11px;padding-right:11px}
  .ctl .seg::-webkit-scrollbar{display:none}
  .seg button{white-space:nowrap;flex:0 0 auto}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand">
    <h1 class="logo">BETHOUSE</h1>
    <div class="tagline" id="tagline">NFL</div>
  <nav class="boards" aria-label="Other boards">
  <a class="navlink" href="bets.html">Bets →</a>
  <a class="navlink" href="cfb.html">CFB →</a>
  <a class="navlink" href="index.html">Baseball →</a>
  <a class="navlink" href="golf.html">PGA →</a>
  </nav>
  </div>
  <div class="ctl">
    <label id="lab-view">Bet type</label>
    <div class="seg" id="view" role="group" aria-labelledby="lab-view"></div>
  </div>
  <div class="ctl" id="find">
    <label id="lab-q" for="q">Find</label>
    <input class="search" id="q" type="search" placeholder="Player or team" autocomplete="off" spellcheck="false">
  </div>
</header>

<div class="note" id="note"></div>
<div class="controls" id="parlayctl" hidden>
  <div class="ctl">
    <label id="lab-plegs">Suggest a parlay</label>
    <div class="seg" id="plegs" role="group" aria-labelledby="lab-plegs"></div>
  </div>
  <div class="ctl">
    <label id="lab-pscope">From</label>
    <div class="seg" id="pscope" role="group" aria-labelledby="lab-pscope"></div>
  </div>
  <div class="ctl">
    <label id="lab-pkinds">Legs</label>
    <div class="seg" id="pkinds" role="group" aria-labelledby="lab-pkinds"></div>
  </div>
  <div class="ctl" id="pgamewrap" hidden>
    <label id="lab-pgame" for="pgame">Game</label>
    <select id="pgame" class="search"></select>
  </div>
</div>
<div class="controls" id="controls" hidden>
  <div class="ctl">
    <label id="lab-line">Line</label>
    <div class="seg" id="lineseg" role="group" aria-labelledby="lab-line"></div>
  </div>
</div>
<div id="app"><div class="empty"><div class="big">Loading…</div>
  <div>If this does not clear, run <code>node fetch-nfl.mjs</code>.</div></div></div>
<footer id="foot"></footer>
</div>

<script src="edge.js"></script>
<script src="nfl.js"></script>
<script src="nfl-data.js"></script>
<!-- Written by track-nfl.mjs. Empty until a week has been graded. -->
<script src="nfl-record.js"></script>
<script src="parlay.js"></script>
<script src="football-board.js"></script>
<script>
/* The page is football-board.js, shared with cfb.html. What is the NFL's
   own is the model, the data, the record, and the numbers it quotes --
   every one of them from `node backtest-nfl.mjs` on 2026-09-05 (touchdowns, receiving yards, game lines) and 2026-09-08 (the other counting props). */
BetHouseFootballBoard.mount({
  model: window.BetHouseNFL,
  data: window.BetHouseNFLData,
  record: window.BETHOUSE_NFL_RECORD,
  league: 'NFL',
  fetcher: 'fetch-nfl.mjs',
  copy: {
    noteTD: 'Chance of <b>scoring a touchdown</b>. Checked against <b>8,470</b> unseen player-games — '+
      'bias 0.8 points, every band within 3. Tap a player for the work.',
    noteStat: {
      recyds: 'Chance of going <b>over</b> a receiving yards line. Checked against <b>22,360</b> unseen '+
        'player-games — bias 1.2 points, cold. The opponent is shown but not applied: on the replay it moved nothing. '+
        'The shape comes from real receiver games, not a bell curve.',
      rushyds: 'Chance of going <b>over</b> a rushing yards line, the opponent\'s run defence applied at half strength. '+
        'Checked against <b>10,500</b> unseen player-games — bias 1.4 points, hot, every band within 2. The shape comes from '+
        'real games by backs the board would price, not a bell curve; a pool that let quarterbacks\' scrambles in ran 7 points cold.',
      passyds: 'Chance of going <b>over</b> a passing yards line, the opponent\'s pass defence applied at half strength. '+
        'Checked against <b>4,265</b> unseen player-games — bias 1.1 points, hot, but the two seasons disagree by 4 points and '+
        'the bands say the number is too timid at both ends. Read it as approximate. The shape comes from real quarterback games, not a bell curve.',
      recs: 'Chance of going <b>over</b> a receptions line. Checked against <b>22,610</b> unseen '+
        'player-games — bias 0.5 points, cold, though the two seasons disagree by 6. The opponent is shown but not applied: '+
        'on the replay it moved nothing. The shape comes from real receiver games, not a bell curve.'
    },
    noteGames: 'The side the model likes on each game, against a real line, with its expected value at the price. '+
      '<b>This model did not beat the closing line over two seasons</b> — read the note below before betting one.',
    gameBanner: '<p>These projections were measured against <b>480 real closing lines</b> and did not beat them. '+
      'The spread model won <b>48.1%</b> of the time and the total model <b>52.5%</b>, against the '+
      '<b>52.4%</b> you need at -110 — and both confidence intervals straddle a coin flip. '+
      'Separating a break-even model from noise would take about <b>1,700</b> games; two seasons is 480.</p>'+
      '<p>The picks are shown because you asked which side, not because there is proven edge in them. Every one '+
      'is recorded before kickoff and settled like a book would, and the live record at the bottom will say whether '+
      'they win and whether the closing line moves toward them.</p>',
    mlVerdict: '<b>Do not bet the moneyline off this.</b> In the replay the market\'s win probabilities beat the model\'s (Brier 0.1999 against 0.2220), and betting the side the model liked more than the market lost <b>11.9%</b> of stake over 468 games.',
    gameHonestly: 'this did not beat the closing line over two seasons',
    footer: '<p><b>Does it work?</b> Two seasons replayed a game at a time, each game predicted only from '+
      'games already played:</p><table>'+
      '<tr><td>anytime touchdown</td><td>bias <b>&minus;0.8pp</b>, Brier <b>0.1591</b> against 0.1718 · '+
      'top 20% scored <b>39.0%</b>, bottom 20% <b>9.3%</b></td></tr>'+
      '<tr><td>receiving yards</td><td>bias <b>&minus;1.2pp</b>, Brier <b>0.2224</b> against 0.2460</td></tr>'+
      '<tr><td>rushing yards</td><td>bias <b>+1.4pp</b>, Brier <b>0.2220</b> against 0.2481 · opponent at half strength</td></tr>'+
      '<tr><td>passing yards</td><td>bias <b>+1.1pp</b>, Brier <b>0.1611</b> against 0.2490 · seasons 4pp apart · opponent at half strength</td></tr>'+
      '<tr><td>receptions</td><td>bias <b>&minus;0.5pp</b>, Brier <b>0.2047</b> against 0.2374 · seasons 6pp apart</td></tr>'+
      '<tr><td>spread</td><td><b>48.1%</b> against the closing line — needs 52.4%</td></tr>'+
      '<tr><td>total</td><td><b>52.5%</b> against the closing line — inside the noise</td></tr>'+
      '</table><p>The player props are calibrated on the whole and worth reading; passing yards and receptions '+
      'move a few points between seasons, so hold them more loosely. The game lines are not: '+
      'the NFL closing number is very good, and two seasons is not enough games to prove otherwise '+
      'either way. Re-check with <code>node backtest-nfl.mjs</code>.</p>'
  }
});
</script>
</body>
</html>

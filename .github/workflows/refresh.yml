name: Refresh board

# Lineups post roughly 3-4 hours before first pitch and keep landing all
# afternoon, so refresh often through the US game window. Times are UTC:
# 14:00 UTC is 7am Pacific, 03:00 UTC is 8pm Pacific.
#
# This is free. statsapi.mlb.com needs no key, and a public repo gets
# unlimited Actions minutes, so there is no budget to manage here.
on:
  schedule:
    - cron: "*/30 14-23 * * *"
    - cron: "*/30 0-3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch today's slate
        run: node fetch-mlb.mjs

      - name: Fetch the golf board
        # Cheap: the season cache only re-fetches tournaments that have
        # finished since last run, so most runs cost a single schedule
        # request. Never fail the whole refresh over golf — the baseball
        # board is the thing people open every day.
        run: node fetch-pga.mjs || echo "PGA fetch failed, keeping the previous board"

      - name: Sanity check before committing
        # Never publish a broken board. If the fetch produced something the
        # app cannot read, fail here rather than commit it.
        run: |
          node -e '
            global.window = {};
            require("./mlb-data.js");
            const d = window.BETHOUSE_MLB;
            if (!d || !Array.isArray(d.games)) throw new Error("no games array");
            if (!d.league || !d.league.rates) throw new Error("no league rates");
            const slots = d.games.reduce((n,g)=>n+g.away.lineup.length+g.home.lineup.length,0);
            if (d.games.length && slots < d.games.length * 9) throw new Error("lineups look truncated: " + slots);
            console.log("ok:", d.games.length, "games,", slots, "lineup slots");
          '
          # The golf board is allowed to be absent (the fetch step is
          # non-fatal) but never malformed.
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("pga-data.js")) { console.log("no pga-data.js yet — skipping"); process.exit(0); }
            global.window = {};
            require("./pga-data.js");
            const d = window.BetHousePGAData;
            if (!d || !d.event) throw new Error("no event");
            if (!Array.isArray(d.field) || !d.field.length) throw new Error("empty field");
            console.log("ok:", d.event.name, d.field.length, "players, cut", d.event.cut);
          '
          # Name the test files explicitly. `node --test` bare discovery picks
          # up backtest.mjs and backtest-pga.mjs on Node 21+ and would fire
          # ~100 live API calls at statsapi and ESPN on every scheduled run.
          node --test edge.test.mjs score.test.mjs golf.test.mjs nfl.test.mjs

      - name: Record predictions and grade finished games
        run: |
          # Snapshot is idempotent and pregame-only: the first prediction for
          # a player on a given day is kept and never overwritten, so the
          # every-30-minutes cadence cannot turn a 7th-inning number into a
          # graded "prediction".
          node track.mjs snapshot
          node track.mjs grade
          node track.mjs report --write-record

      - name: Commit if the board changed
        run: |
          git config user.name  "bethouse-bot"
          git config user.email "bethouse-bot@users.noreply.github.com"
          # record.js only exists once a day has been graded, and history/
          # only once something has been snapshotted. Adding a path that is
          # not there yet is a fatal error, which took down every scheduled
          # run until the first graded day.
          git add mlb-data.js
          [ -f pga-data.js ] && git add pga-data.js || true
          [ -f pga-history.json ] && git add pga-history.json || true
          [ -f record.js ] && git add record.js || true
          [ -d history ] && git add history/ || true
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "board: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BetHouse — College football</title>
<link rel="stylesheet" href="fonts/space-grotesk.css">
<style>
html{color-scheme:dark}
:root{
  --bg:#12161f; --panel:rgba(255,255,255,0.04); --panel2:rgba(255,255,255,0.025);
  --line:rgba(255,255,255,0.09); --text:#eef1f7; --muted:#a6b0c4;
  --accent:#38e1ff; --accent2:#7c5cff; --warn:#e0a33f; --bad:#d8434f; --good:#5fce8f;
  --display:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;
}
*{box-sizing:border-box}
/* The `hidden` attribute must actually hide. A class that sets
   `display` (.ctl and .controls both set display:flex) beats the UA
   stylesheet's [hidden]{display:none} because author styles win over
   UA styles, so `el.hidden = true` silently did nothing and left dead
   controls on screen. Standard reset idiom; !important is the point. */
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 520px at 88% -8%,rgba(124,92,255,.16),transparent 60%),
             radial-gradient(760px 480px at 4% 104%,rgba(56,225,255,.11),transparent 60%)}
.wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:22px 18px 60px}
header{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.brand{flex:1 1 auto;min-width:200px}
.logo{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:.14em;
  background:linear-gradient(96deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;margin:0}
.tagline{font-family:var(--display);font-size:11px;font-weight:600;letter-spacing:.17em;text-transform:uppercase;color:var(--muted);margin-top:5px}
.navlink{font-family:var(--display);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:7px 12px;white-space:nowrap}
.navlink:hover{color:var(--text);border-color:var(--accent)}
/* Measure, not just size. At 12.5px across the full 1040px column this
   line ran 166 characters wide -- more than double the 75-character
   maximum, and long measure is what actually breaks readability: the
   eye loses the start of the next line on the return sweep. Capping at
   56ch brings it to 72 real characters (1ch is the width of "0", which
   is wider than average prose -- 72ch measured 93 chars, not 72), and
   14px makes the one paragraph
   carrying the calibration caveats no longer the smallest prose here. */
.note{color:var(--muted);font-size:14px;line-height:1.65;margin:0 2px 14px;max-width:56ch}
.note b{color:var(--text);font-weight:600}
.note details{margin-top:4px}
.note summary{cursor:pointer;color:var(--accent);font-size:13px;list-style-position:inside}
.note details p{margin:6px 0 0}
.controls{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end;background:var(--panel);
  border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin-bottom:14px}
.ctl{display:flex;flex-direction:column;gap:6px}
.ctl>label{font-family:var(--display);font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.seg{display:flex;gap:4px}
.seg button{font:inherit;font-size:13px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 11px;cursor:pointer}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed=true]{color:#0a0d14;background:linear-gradient(180deg,#7fe9ff,var(--accent));border-color:transparent;font-weight:600}
.game{border:1px solid var(--line);border-radius:15px;background:var(--panel2);margin-bottom:14px;overflow:hidden}
.ghead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;
  padding:12px 15px;background:rgba(255,255,255,.03);border-bottom:1px solid var(--line)}
.gtitle{font-family:var(--display);font-size:15px;font-weight:700;margin:0}
.gmeta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.row{display:grid;grid-template-columns:30px 1fr 74px 62px 20px;gap:10px;align-items:center;
  width:100%;text-align:left;font:inherit;color:inherit;background:none;border:0;
  padding:8px 15px;cursor:pointer;border-top:1px solid rgba(255,255,255,.045)}
.row:hover{background:rgba(255,255,255,.028)}
.slot{font-family:var(--display);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.who{font-weight:600;font-size:14.5px}
.pos{color:var(--muted);font-weight:400;font-size:12px;margin-left:5px}
.prob{font-weight:700;font-size:21px;font-variant-numeric:tabular-nums;text-align:right}
.be{font-variant-numeric:tabular-nums;text-align:right;font-size:14px}
.be small,.prob small{display:block;color:var(--muted);font-size:11px;font-weight:400;letter-spacing:.04em}
.caret{color:var(--muted);text-align:center;transition:transform .16s}
.row[aria-expanded=true] .caret{transform:rotate(90deg)}
.why{padding:2px 15px 16px;background:rgba(0,0,0,.16);border-top:1px solid var(--line);font-size:13px;color:var(--muted);line-height:1.75}
.why b{color:var(--text);font-variant-numeric:tabular-nums}
.why table{border-collapse:collapse;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.why td{padding:2px 16px 2px 0;vertical-align:top}
.why td:first-child{color:var(--muted)}
.why p{margin:8px 0 0}
.why .verdict{color:var(--text);font-size:14px}
.tag{display:inline-block;margin-left:7px;padding:1px 6px;border-radius:4px;font-size:10.5px;font-weight:600;letter-spacing:.03em;vertical-align:1px}
.tag.soft{background:rgba(95,206,143,.16);color:var(--good)}
.tag.tough{background:rgba(216,67,79,.16);color:var(--bad)}
.tag.q{background:rgba(224,163,63,.16);color:var(--warn)}
.banner{border:1px solid rgba(224,163,63,.45);background:rgba(224,163,63,.09);border-radius:14px;padding:15px 17px;margin-bottom:16px}
.banner h3{font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--warn);margin:0 0 8px}
.banner p{margin:0 0 7px;font-size:13.5px;line-height:1.65;color:var(--text)}
.banner b{color:var(--text)}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty .big{font-family:var(--display);font-size:18px;font-weight:600;color:var(--text);margin-bottom:7px}
footer{margin-top:22px;color:var(--muted);font-size:12px;line-height:1.7}
footer b{color:var(--text)}
footer table{border-collapse:collapse;margin:8px 0;font-variant-numeric:tabular-nums;font-size:12px}
footer td{padding:1px 14px 1px 0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (max-width:760px){
  .wrap{padding:14px 11px 40px}
  .row{grid-template-columns:26px 1fr 64px 56px 12px;gap:8px;padding:8px 12px}
  .caret{font-size:13px}
  .prob{font-size:18px}
}
/* Touch: fingers need 44px; the mouse does not. Same rule as index.html. */
@media (pointer:coarse){ .seg button,.navlink{min-height:44px} }
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand">
    <h1 class="logo">BETHOUSE</h1>
    <div class="tagline" id="tagline">College football</div>
  </div>
  <div class="ctl">
    <label id="lab-view">Bet type</label>
    <div class="seg" id="view" role="group" aria-labelledby="lab-view"></div>
  </div>
  <a class="navlink" href="bets.html">Bets →</a>
  <a class="navlink" href="nfl.html">NFL →</a>
  <a class="navlink" href="index.html">Baseball →</a>
  <a class="navlink" href="golf.html">PGA →</a>
</header>

<div class="note" id="note"></div>
<div class="controls" id="controls" hidden>
  <div class="ctl">
    <label id="lab-line">Line</label>
    <div class="seg" id="lineseg" role="group" aria-labelledby="lab-line"></div>
  </div>
</div>
<div id="app"><div class="empty"><div class="big">Loading…</div>
  <div>If this does not clear, run <code>node fetch-cfb.mjs</code>.</div></div></div>
<footer id="foot"></footer>
</div>

<script src="edge.js"></script>
<script src="nfl.js"></script>
<script src="cfb.js"></script>
<script src="cfb-data.js"></script>
<!-- Written by track-cfb.mjs. Empty until a week has been graded. -->
<script src="cfb-record.js"></script>
<script src="football-board.js"></script>
<script>
/* The page is football-board.js, shared with nfl.html. What is college
   football's own is the model (nfl.js bound to college constants, cfb.js),
   the data, the record, and the numbers it quotes -- every one of them from
   `node backtest-nfl.mjs --league cfb` on 2026-09-05 (touchdowns, game lines) and 2026-09-08 (the counting props). */
BetHouseFootballBoard.mount({
  model: window.BetHouseCFB,
  data: window.BetHouseCFBData,
  record: window.BETHOUSE_CFB_RECORD,
  league: 'College football',
  fetcher: 'fetch-cfb.mjs',
  copy: {
    noteTD: 'Chance of <b>scoring a touchdown</b>. Checked against <b>25,345</b> unseen FBS player-games — '+
      'bias 1.4 points, cold, and the top of the board runs 2 to 4 points cold. Tap a player for the work.',
    noteStat: {
      recyds: 'Chance of going <b>over</b> a receiving yards line. Checked against <b>58,140</b> unseen '+
        'player-games — <b>3 points cold</b>, and the replay is sensitive to a modelling choice by about that much either way. '+
        'Read the number as approximate. The opponent is shown but not applied: on the replay it moved nothing. '+
        'The shape comes from real receiver games, not a bell curve.',
      rushyds: 'Chance of going <b>over</b> a rushing yards line, the opponent\'s run defence applied at half strength. '+
        'Checked against <b>40,170</b> unseen player-games — bias 0.9 points, hot, every band within 2. The shape comes from '+
        'real games by backs the board would price, not a bell curve; a pool that let quarterbacks\' scrambles in ran 9 points cold.',
      passyds: 'Chance of going <b>over</b> a passing yards line, the opponent\'s pass defence applied at half strength. '+
        'Checked against <b>9,125</b> unseen player-games — bias 1.6 points, cold, and the bands say the number is too timid '+
        'at both ends. Read it as approximate. The shape comes from real quarterback games, not a bell curve.',
      recs: 'Chance of going <b>over</b> a receptions line. Checked against <b>49,600</b> unseen '+
        'player-games — bias 1.1 points, cold, every band within 3. The opponent is shown but not applied: on the replay it '+
        'made this prop worse. The shape comes from real receiver games, not a bell curve.'
    },
    noteGames: 'The side the model likes on each game, against a real line, with its expected value at the price. '+
      '<b>Not proven against the closing line</b> — read the note below before betting one.',
    gameBanner: '<p>These projections were measured against <b>1,488 real closing lines</b>. '+
      'The spread model won <b>51.7%</b> of the time and the total model <b>53.4%</b>, against the '+
      '<b>52.4%</b> you need at -110. Both confidence intervals straddle break-even. Where the model '+
      'disagreed with the line by six points or more the total went <b>56.5%</b> — on 322 games, which is '+
      'still inside the noise. Separating a break-even model from a coin flip takes about <b>1,700</b> games; '+
      'two seasons is 1,488.</p>'+
      '<p>Twenty seasons say the same as two: against 14,296 closing spreads since 2006 the projection carries no '+
      'information the line does not (slope −0.04, no era above 0.01), and the high-total under that looked like 55% '+
      'on two seasons is 52.1% on 5,917 games, which is break-even. The picks are shown because you asked which '+
      'side, not because there is proven edge in them. Every one is recorded before kickoff and settled like a book '+
      'would, and the live record at the bottom will say whether they win and whether the closing line moves toward '+
      'them. Opponents outside the FBS are rated as one team, <b>FCS</b>.</p>',
    mlVerdict: '<b>Do not bet the moneyline off this.</b> In the replay the market\'s win probabilities beat the model\'s (Brier 0.1742 against 0.1867), and betting the side the model liked more than the market lost <b>4.7%</b> of stake over 1,432 games.',
    gameHonestly: 'no information beyond the closing line over twenty seasons (2006–2025, 14,296 games); the lean is shown, not proven',
    footer: '<p><b>Does it work?</b> Two FBS seasons replayed a game at a time, each game predicted only from '+
      'games already played:</p><table>'+
      '<tr><td>anytime touchdown</td><td>bias <b>&minus;1.4pp</b>, Brier <b>0.1743</b> against 0.1921 · '+
      'top 20% scored <b>47.3%</b>, bottom 20% <b>9.5%</b></td></tr>'+
      '<tr><td>receiving yards</td><td>bias <b>&minus;3.2pp</b>, Brier <b>0.2300</b> against 0.2492</td></tr>'+
      '<tr><td>rushing yards</td><td>bias <b>+0.9pp</b>, Brier <b>0.2321</b> against 0.2500 · opponent at half strength</td></tr>'+
      '<tr><td>passing yards</td><td>bias <b>&minus;1.6pp</b>, Brier <b>0.1779</b> against 0.2421 · timid at both ends · opponent at half strength</td></tr>'+
      '<tr><td>receptions</td><td>bias <b>&minus;1.1pp</b>, Brier <b>0.2131</b> against 0.2454</td></tr>'+
      '<tr><td>spread</td><td><b>51.7%</b> against the closing line — needs 52.4%; inside the noise</td></tr>'+
      '<tr><td>total</td><td><b>53.4%</b> against the closing line — inside the noise</td></tr>'+
      '</table><p>The touchdown model separates hard and runs a little cold. The receiving yards model runs colder, '+
      'and its replay depends on which games go into the comparison pool by three or four points, so treat '+
      'it as approximate until the live record below has thousands of rows; rushing yards and receptions are '+
      'within a point, and passing yards is the one to hold loosely. The game lines are closer to '+
      'break-even than the NFL\'s, which is what a softer market looks like, and 1,488 games cannot tell '+
      'break-even from an edge. Re-check with <code>node backtest-nfl.mjs --league cfb</code>.</p>'
  }
});
</script>
</body>
</html>
